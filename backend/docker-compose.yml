services:
  postgres:
    image: postgres:16-alpine
    container_name: volter_pawnshop_db
    environment:
      POSTGRES_USER: volter
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: volter_pawnshop
      # Critical for timestamp consistency
      TZ: Europe/Skopje
      PGTZ: Europe/Skopje
    ports:
      - "5432:5432"
    volumes:
      # Persist data
      - volter_pgdata:/var/lib/postgresql/data
      # Optional: init schema on first run
      - ./init-scripts:/docker-entrypoint-initdb.d
    command:
      # Set timezone at PostgreSQL level too
      - "postgres"
      - "-c"
      - "timezone=Europe/Skopje"
      - "-c"
      - "log_timezone=Europe/Skopje"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volter -d volter_pawnshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  volter_pgdata:
    driver: local