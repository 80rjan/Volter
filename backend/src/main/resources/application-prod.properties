# ========================================
# PROD profile
# ========================================
# Demo-data seeding is DISABLED here: only the schema + reference-data (roles/
# permissions) migration locations are listed — never the db/seed/** demo
# locations. (Explicit, even though it matches the base default, so the prod
# policy is obvious in one place.)
volter.flyway.public-locations=classpath:db/migration/public
volter.flyway.tenant-locations=classpath:db/migration/tenant

# Quieter logging in production.
logging.level.root=WARN
logging.level.com.volter=INFO

# Never log SQL in production.
spring.jpa.show-sql=false

# Honour X-Forwarded-* headers when running behind a reverse proxy / load
# balancer (e.g. DigitalOcean), so generated URLs and the scheme are correct.
server.forward-headers-strategy=framework
