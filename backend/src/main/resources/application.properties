spring.application.name=volter-backend
server.port=${PORT:8080}

# ========================================
# CORS & Frontend Configuration
# ========================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

frontend.url=${FRONTEND_URL:http://localhost:5173}
backend.url=${BACKEND_URL:http://localhost:8080}

# ========================================
# JPA & Hibernate
# ========================================
# DDL is owned entirely by Flyway (run per-schema in SchemaInitializer).
# Hibernate must never auto-generate schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway is invoked manually per schema (public + each tenant) in
# SchemaInitializer, so Boot's single-schema auto-run stays disabled.
spring.flyway.enabled=false

# ========================================
# PostgreSQL Connection
# ========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ========================================
# Gold price feed (goldapi.io proxy)
# ========================================
gold.api.url=${GOLD_API_URL:https://www.goldapi.io/api/XAU/EUR}
gold.api.key=${GOLD_API_KEY:}

# ========================================
# JWT Configuration
# ========================================
jwt.secret=${JWT_CONFIG_SECRET}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:720}
jwt.pre-auth-ttl-minutes=${JWT_PRE_AUTH_TTL_MINUTES:5}

# ========================================
# Logging
# ========================================
# Logs go to the console (default) AND this file. One file per running instance.
logging.file.name=${LOG_FILE:logs/volter.log}
# Rotate so the file never grows unbounded: roll at 10MB, keep 14 archives, cap total at 500MB.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
