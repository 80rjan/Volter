spring.application.name=volter-backend
server.port=${PORT:8080}

# ========================================
# CORS & Frontend Configuration
# ========================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

frontend.url=${FRONTEND_URL:http://localhost:5173}
backend.url=${BACKEND_URL:http://localhost:8080}

# ========================================
# API Paths
# ========================================
api.base.path=/api
api.admin.path=/api/admin

# ========================================
# JPA & Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway config
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true

# ========================================
# PostgreSQL Connection
# ========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ========================================
# JWT Configuration
# ========================================
jwt.secret=${JWT_CONFIG_SECRET}
# 12 hours
jwt.expiration=43200000