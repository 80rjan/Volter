spring.application.name=volter-backend
server.port=${PORT:8080}

# Active profile. Defaults to `dev` for local development (enables demo-data
# seeding). Production MUST run with SPRING_PROFILES_ACTIVE=prod — the prod
# Docker Compose file sets this explicitly. The `dev` profile is the ONLY thing
# that enables demo seeding (see SchemaInitializer).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========================================
# CORS & Frontend Configuration
# ========================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

frontend.url=${FRONTEND_URL:http://localhost:5173}
backend.url=${BACKEND_URL:http://localhost:8080}

# ========================================
# JPA & Hibernate
# ========================================
# DDL is owned entirely by Flyway (run per-schema in SchemaInitializer).
# Hibernate must never auto-generate schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Read/write timestamps in the shop's timezone so OffsetDateTime values come back
# with the local offset and display as local wall-clock time. (The stored instant
# is unchanged.) Without this they round-trip as UTC and the UI reads 2h behind
# local (CEST). Pair with TZ=Europe/Skopje on the container so now()/LocalDate.now()
# are local too.
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Skopje

# Serialize timestamps in the shop's timezone too. By default Jackson normalizes
# OffsetDateTime to its context zone (UTC) before writing JSON, so the API would
# send "...T10:00Z" and the UI (which shows the wall-clock as-is) reads 2h behind.
# This makes it send the local offset ("...T12:00+02:00") instead.
spring.jackson.time-zone=Europe/Skopje

# Flyway is invoked manually per schema (public + each tenant) in
# SchemaInitializer, so Boot's single-schema auto-run stays disabled.
spring.flyway.enabled=false

# Flyway locations read by SchemaInitializer. Default = schema + reference data
# only (the safe, production-like baseline). The `dev` profile overrides these to
# also include the db/seed/** demo locations; `prod` keeps them as-is.
volter.flyway.public-locations=classpath:db/migration/public
volter.flyway.tenant-locations=classpath:db/migration/tenant

# ========================================
# PostgreSQL Connection
# ========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ========================================
# Gold price feed (goldapi.io proxy)
# ========================================
gold.api.url=${GOLD_API_URL:https://www.goldapi.io/api/XAU/EUR}
gold.api.key=${GOLD_API_KEY:}

# ========================================
# JWT Configuration
# ========================================
jwt.secret=${JWT_CONFIG_SECRET}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:720}
jwt.pre-auth-ttl-minutes=${JWT_PRE_AUTH_TTL_MINUTES:5}

# ========================================
# Logging
# ========================================
# Logs go to the console (default) AND this file. One file per running instance.
logging.file.name=${LOG_FILE:logs/volter.log}
# Rotate so the file never grows unbounded: roll at 10MB, keep 14 archives, cap total at 500MB.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
