# ========================================
# DEV profile
# ========================================
# Enables demo-data seeding by layering the db/seed/** Flyway locations on top of
# the schema migrations. Use for local development and the dev Docker Compose
# stack against a throwaway dev database.
volter.flyway.public-locations=classpath:db/migration/public,classpath:db/seed/public
volter.flyway.tenant-locations=classpath:db/migration/tenant,classpath:db/seed/tenant

# Verbose-ish logging to aid debugging new features and bugs.
logging.level.com.volter=DEBUG

# Show SQL on demand (override with SHOW_SQL=true).
spring.jpa.show-sql=${SHOW_SQL:false}
