# =====================================================================
# Volter — PRODUCTION stack (e.g. DigitalOcean)
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The backend runs the `prod` profile, so demo data is NOT seeded — only
# schema + reference data (roles/permissions). The frontend is the static
# production build served by nginx. Secrets come from .env.prod (never
# committed; copy from .env.prod and fill in real values).
# =====================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: volter_db_prod
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Skopje
      PGTZ: Europe/Skopje
    # No host port published: the DB is reachable only on the internal compose
    # network (backend connects via the `postgres` hostname). Don't expose a
    # database to the public internet.
    volumes:
      - volter_pgdata_prod:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Skopje"
      - "-c"
      - "log_timezone=Europe/Skopje"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volter_backend_prod
    environment:
      # Profile is intrinsic to this file → demo seeding OFF.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_CONFIG_SECRET: ${JWT_CONFIG_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOLD_API_KEY: ${GOLD_API_KEY:-}
    # No published port: the API is reachable only on the internal network, via
    # the frontend's nginx /api proxy. Never exposed to the host/internet.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the static bundle at build time. Use /api for same-origin.
        VITE_API_BASE: ${VITE_API_BASE}
    container_name: volter_frontend_prod
    # Bound to localhost only — public access is via the Cloudflare tunnel, not a
    # published port. This 127.0.0.1 bind is just for on-droplet debugging
    # (curl http://localhost:8081). Remove it for zero host exposure.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  # Cloudflare Tunnel: connects OUTBOUND to Cloudflare and serves the app at your
  # public hostname (e.g. erp.your-domain.mk -> http://frontend:80). No inbound
  # ports are opened on the droplet. WHO may reach it (the Access policies) is
  # configured in the Cloudflare Zero Trust dashboard, not here.
  cloudflared:
    image: cloudflare/cloudflared:latest   # pin a specific version for prod
    container_name: volter_cloudflared
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: always

volumes:
  volter_pgdata_prod:
    driver: local
