server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/*, which we proxy to the backend
    # over the internal Docker network. The backend itself is never published,
    # and there is no cross-origin (no CORS) to worry about.
    # Trailing slash on proxy_pass strips the /api prefix: /api/pawns -> /pawns.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback. Harmless with HashRouter, and serves index.html for any path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
