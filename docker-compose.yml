services:
  postgres:
    image: postgres:16-alpine
    container_name: volter_db
    environment:
      POSTGRES_USER: volter_user
      POSTGRES_PASSWORD: volter123
      POSTGRES_DB: volter
      TZ: Europe/Skopje
      PGTZ: Europe/Skopje
    ports:
      - "5432:5432"
    volumes:
      - volter_pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "timezone=Europe/Skopje"
      - "-c"
      - "log_timezone=Europe/Skopje"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volter_user -d volter"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volter_backend
    # Pulls GOLD_API_KEY (and anything else) from backend/.env into the container.
    # The explicit `environment:` below overrides the datasource/JWT values for
    # Docker, so .env's localhost-oriented values don't leak in.
    env_file:
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/volter
      SPRING_DATASOURCE_USERNAME: volter_user
      SPRING_DATASOURCE_PASSWORD: volter123
      JWT_CONFIG_SECRET: zXNc4+RJ95DIa5F95Kt2vonGZuaAfAWv+IJDEfPQ/mI=
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: volter_frontend
    # Live-reload: mount the host source into the container so Vite's HMR picks up
    # edits instantly (no rebuild). The anonymous volume keeps the container's own
    # node_modules from being shadowed by the host mount.
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      # Reliable file watching across the Docker bind mount (needed on macOS).
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  volter_pgdata:
    driver: local
